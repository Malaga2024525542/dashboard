name: Actualizar índice

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytrends
      - run: python actualizar.py docs/index.html
      - name: Guardar cambios
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Actualizar índice" || exit 0
          git push
